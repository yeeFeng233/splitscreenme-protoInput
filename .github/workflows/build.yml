name: Build ProtoInput x64 - original SDK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity-check source without retargeting
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $requiredProjects = @(
            "lib\EasyHook\EasyHookDll\EasyHookDll.vcxproj",
            "lib\Blackbone\src\BlackBone\BlackBone.vcxproj",
            "lib\openxinput-OpenXinput1_4\DEVOBJ\DEVOBJ.vcxproj",
            "lib\openxinput-OpenXinput1_4\OpenXinput.vcxproj",
            "src\ProtoInput\ProtoInputUtil\ProtoInputUtil.vcxproj",
            "src\ProtoInput\ProtoInputUtilDynamic\ProtoInputUtilDynamic.vcxproj",
            "src\ProtoInput\ProtoInputInjectorProxy\ProtoInputInjectorProxy.vcxproj",
            "src\ProtoInput\ProtoInputInjector\ProtoInputInjector.vcxproj",
            "src\ProtoInput\ProtoInputHooks\ProtoInputHooks.vcxproj",
            "src\ProtoInput\ProtoInputLoader\ProtoInputLoader.vcxproj",
            "src\ProtoInput\ProtoInputHost\ProtoInputHost.vcxproj"
          )

          foreach ($p in $requiredProjects) {
            if (-not (Test-Path $p)) {
              throw "Required project is missing: $p"
            }
            Write-Host "OK project: $p"
          }

          $header = "src\ProtoInput\ProtoInputLoader\include\protoloader.h"
          $text = Get-Content $header -Raw

          foreach ($symbol in @(
            "SetTranslateXinputtoMKB",
            "SetXinputtoMKBkeys",
            "SetXinputtoMKBCFG"
          )) {
            if ($text -notmatch [regex]::Escape($symbol)) {
              throw "Current source tree does not contain required API: $symbol"
            }
            Write-Host "OK source API: $symbol"
          }


          # ProtoInput is known to be sensitive to VS/SDK retargeting.
          # The upstream projects intentionally target Windows SDK 18362 + v142.
          # Fail early if upstream changes or if this fork has been retargeted.
          $nativeSdkProjects = @(
            "lib\EasyHook\EasyHookDll\EasyHookDll.vcxproj",
            "lib\Blackbone\src\BlackBone\BlackBone.vcxproj",
            "lib\openxinput-OpenXinput1_4\OpenXinput.vcxproj",
            "src\ProtoInput\ProtoInputUtil\ProtoInputUtil.vcxproj",
            "src\ProtoInput\ProtoInputUtilDynamic\ProtoInputUtilDynamic.vcxproj",
            "src\ProtoInput\ProtoInputInjectorProxy\ProtoInputInjectorProxy.vcxproj",
            "src\ProtoInput\ProtoInputInjector\ProtoInputInjector.vcxproj",
            "src\ProtoInput\ProtoInputHooks\ProtoInputHooks.vcxproj",
            "src\ProtoInput\ProtoInputLoader\ProtoInputLoader.vcxproj",
            "src\ProtoInput\ProtoInputHost\ProtoInputHost.vcxproj"
          )

          foreach ($p in $nativeSdkProjects) {
            $body = Get-Content $p -Raw

            if ($body -notmatch '<WindowsTargetPlatformVersion>10\.0\.18362\.0</WindowsTargetPlatformVersion>') {
              throw "Project is not targeting original Windows SDK 10.0.18362.0: $p"
            }

            # Release|x64 is expected to use v142 in upstream ProtoInput.
            if ($body -notmatch '<PlatformToolset>v142</PlatformToolset>') {
              throw "v142 toolset declaration not found: $p"
            }

            Write-Host "OK original SDK/toolset: $p"
          }

          # DEVOBJ is the one exception: upstream uses the generic 10.0 target.
          $devobj = Get-Content "lib\openxinput-OpenXinput1_4\DEVOBJ\DEVOBJ.vcxproj" -Raw
          if ($devobj -notmatch '<WindowsTargetPlatformVersion>10\.0</WindowsTargetPlatformVersion>') {
            throw "Unexpected DEVOBJ SDK target."
          }
          Write-Host "OK DEVOBJ generic SDK target"


          # Verify the path assumptions used later in this workflow against
          # the checked-out project files before spending time compiling.
          $checks = @(
            @{
              File = "lib\Blackbone\src\BlackBone\BlackBone.vcxproj"
              Text = '$(SolutionDir)build\$(Platform)\$(Configuration)\'
              Name = "BlackBone OutDir"
            },
            @{
              File = "src\ProtoInput\ProtoInputUtil\ProtoInputUtil.vcxproj"
              Text = '$(SolutionDir)build\x64\Release'
              Name = "ProtoInputUtil BlackBone library directory"
            },
            @{
              File = "src\ProtoInput\ProtoInputHooks\ProtoInputHooks.vcxproj"
              Text = '$(SolutionDir)build\x64\Release'
              Name = "ProtoInputHooks BlackBone library directory"
            },
            @{
              File = "src\ProtoInput\ProtoInputLoader\ProtoInputLoader.vcxproj"
              Text = '$(SolutionDir)build\x64\Release'
              Name = "ProtoInputLoader BlackBone library directory"
            },
            @{
              File = "lib\openxinput-OpenXinput1_4\OpenXinput.vcxproj"
              Text = "DEVOBJ.lib"
              Name = "OpenXinput DEVOBJ dependency"
            }
          )

          foreach ($c in $checks) {
            $body = Get-Content $c.File -Raw
            if (-not $body.Contains($c.Text)) {
              throw "Source-layout assumption changed: $($c.Name) [$($c.File)]"
            }
            Write-Host "OK layout assumption: $($c.Name)"
          }

      - name: Install v142 ATL if missing
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) {
            throw "Could not locate Visual Studio."
          }

          $v142 = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory |
            Where-Object { $_.Name -like "14.29*" } |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $v142) {
            throw "v142 (14.29) toolset is not installed on this runner."
          }

          $atlHeader = Join-Path $v142.FullName "atlmfc\include\atlbase.h"

          if (-not (Test-Path $atlHeader)) {
            Write-Host "v142 ATL missing; installing ATL only..."

            Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer"

            $args = @(
              "modify",
              "--installPath", "`"$vsPath`"",
              "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL",
              "--quiet",
              "--norestart",
              "--nocache"
            )

            $p = Start-Process `
              -FilePath ".\vs_installer.exe" `
              -ArgumentList $args `
              -Wait `
              -PassThru

            Write-Host "VS Installer exit code: $($p.ExitCode)"
          }

          if (-not (Test-Path $atlHeader)) {
            throw "v142 ATL is still missing: $atlHeader"
          }

          Write-Host "ATL OK: $atlHeader"

      # Do NOT retarget ProtoInput to SDK 19041.
      # Upstream explicitly targets 10.0.18362.0, and Nucleus documentation
      # warns that retargeting/upgrading can produce repeated
      # FILE_INFO_BY_HANDLE_CLASS syntax errors.
      #
      # VS 2022 no longer ships this legacy SDK on hosted runners, therefore
      # install the original Windows 10 SDK 1903 standalone package from
      # Microsoft's official archive.
      - name: Install original Windows SDK 10.0.18362.0
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10"
          $header = Join-Path $sdkRoot "Include\10.0.18362.0\um\Windows.h"
          $fileApi = Join-Path $sdkRoot "Include\10.0.18362.0\um\fileapi.h"
          $kernelLib = Join-Path $sdkRoot "Lib\10.0.18362.0\um\x64\kernel32.lib"

          if ((Test-Path $header) -and (Test-Path $fileApi) -and (Test-Path $kernelLib)) {
            Write-Host "Windows SDK 18362 already installed."
          }
          else {
            $installer = Join-Path $env:RUNNER_TEMP "winsdksetup-18362.exe"
            $log = Join-Path $env:RUNNER_TEMP "winsdk18362-install.log"

            $url = "https://download.microsoft.com/download/4/2/2/42245968-6A79-4DA7-A5FB-08C0AD0AE661/windowssdk/winsdksetup.exe"

            Write-Host "Downloading official Windows SDK 1903 installer..."
            Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing

            Write-Host "Installing Windows SDK 10.0.18362.0..."
            $p = Start-Process `
              -FilePath $installer `
              -ArgumentList @(
                "/features", "+",
                "/quiet",
                "/norestart",
                "/log", "`"$log`""
              ) `
              -Wait `
              -PassThru

            Write-Host "SDK installer exit code: $($p.ExitCode)"

            if ($p.ExitCode -notin @(0, 3010)) {
              if (Test-Path $log) {
                Write-Host "=== SDK installer log tail ==="
                Get-Content $log -Tail 150
              }
              throw "Windows SDK 18362 installer failed with exit code $($p.ExitCode)"
            }
          }

          foreach ($p in @($header, $fileApi, $kernelLib)) {
            if (-not (Test-Path $p)) {
              throw "Windows SDK 18362 installation incomplete; missing: $p"
            }
            Write-Host "OK SDK file: $p"
          }

          Write-Host "`nInstalled SDK directories:"
          Get-ChildItem (Join-Path $sdkRoot "Include") -Directory |
            Select-Object -ExpandProperty Name

      - name: Verify no-retarget build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sdk = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.18362.0"
          if (-not (Test-Path $sdk)) {
            throw "SDK 10.0.18362.0 not found after installation."
          }

          $hooksProject = Get-Content "src\ProtoInput\ProtoInputHooks\ProtoInputHooks.vcxproj" -Raw

          if ($hooksProject -notmatch '<WindowsTargetPlatformVersion>10\.0\.18362\.0</WindowsTargetPlatformVersion>') {
            throw "ProtoInputHooks has been retargeted away from 18362."
          }

          if ($hooksProject -notmatch '<PlatformToolset>v142</PlatformToolset>') {
            throw "ProtoInputHooks no longer declares v142."
          }

          Write-Host "ProtoInputHooks target remains exactly:"
          Write-Host "  WindowsTargetPlatformVersion = 10.0.18362.0"
          Write-Host "  PlatformToolset = v142"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Show toolchain
        shell: powershell
        run: |
          msbuild -version
          Write-Host "`nWindows SDKs:"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" |
            Select-Object -ExpandProperty Name

      # EasyHook is special: its native project uses netfx4-Release|x64.
      # Disable its managed ProjectReferences; those were the source of the
      # Debug|x64 OutputPath failure seen in the first CI attempt.
      - name: Build 01 - EasyHook64 static library
        shell: cmd
        run: >
          msbuild lib\EasyHook\EasyHookDll\EasyHookDll.vcxproj
          /m:1
          /t:Build
          /p:Configuration=netfx4-Release
          /p:Platform=x64
          /p:BuildProjectReferences=false
          /verbosity:minimal

      - name: Verify 01 - EasyHook64.lib
        shell: powershell
        run: |
          $p = "lib\EasyHook\Build\x64\netfx4-Release\EasyHook64.lib"
          if (-not (Test-Path $p)) { throw "Missing: $p" }
          Get-Item $p | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize

      # BlackBone also uses $(SolutionDir) for OutDir/IntDir.
      # When a .vcxproj is built directly, SolutionDir otherwise resolves
      # relative to the BlackBone project itself, producing:
      #   lib\Blackbone\src\BlackBone\build\x64\Release\BlackBone.lib
      # ProtoInput projects, however, search:
      #   $(SolutionDir)build\x64\Release
      # with SolutionDir = src\ProtoInput\.
      # Therefore force the same SolutionDir here.
      - name: Build 02 - BlackBone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solutionDir = (Resolve-Path "src\ProtoInput").Path + "\"

          Write-Host "SolutionDir = $solutionDir"

          & msbuild "lib\Blackbone\src\BlackBone\BlackBone.vcxproj" `
            /m:1 `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$solutionDir" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "BlackBone build failed: $LASTEXITCODE"
          }

      - name: Verify 02 - BlackBone.lib
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $expected = Join-Path $PWD "src\ProtoInput\build\x64\Release\BlackBone.lib"

          if (-not (Test-Path $expected)) {
            Write-Host "BlackBone candidates:"
            Get-ChildItem . -Recurse -File -Filter "BlackBone.lib" |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize
            throw "Missing expected BlackBone.lib: $expected"
          }

          Write-Host "BlackBone is at the exact path used by ProtoInputUtil/Hooks/Loader:"
          Get-Item $expected |
            Select-Object FullName,Length,LastWriteTime |
            Format-Table -AutoSize

      # DEVOBJ uses $(SolutionDir) to decide its output location.
      # Explicitly set it to the directory containing ProtoInput.sln.
      - name: Build 03 - DEVOBJ
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solutionDir = (Resolve-Path "src\ProtoInput").Path + "\"

          & msbuild "lib\openxinput-OpenXinput1_4\DEVOBJ\DEVOBJ.vcxproj" `
            /m:1 `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$solutionDir" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "DEVOBJ build failed: $LASTEXITCODE"
          }

      - name: Verify 03 - DEVOBJ.lib
        shell: powershell
        run: |
          $p = "src\ProtoInput\tmp\Release64\DEVOBJ.lib"
          if (-not (Test-Path $p)) {
            Write-Host "DEVOBJ candidates:"
            Get-ChildItem . -Recurse -File -Filter "DEVOBJ.lib" |
              Select-Object FullName,Length | Format-Table -AutoSize
            throw "Missing expected DEVOBJ.lib: $p"
          }
          Get-Item $p | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize

      # OpenXinput has a ProjectReference to DEVOBJ, but DEVOBJ is already built.
      # Disable ProjectReferences here so the order remains deterministic.
      - name: Build 04 - OpenXinput64 static library
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solutionDir = (Resolve-Path "src\ProtoInput").Path + "\"

          & msbuild "lib\openxinput-OpenXinput1_4\OpenXinput.vcxproj" `
            /m:1 `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:BuildProjectReferences=false `
            "/p:SolutionDir=$solutionDir" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "OpenXinput build failed: $LASTEXITCODE"
          }

      - name: Verify 04 - OpenXinput64.lib
        shell: powershell
        run: |
          $p = "src\ProtoInput\Release\OpenXinput64.lib"
          if (-not (Test-Path $p)) { throw "Missing: $p" }
          Get-Item $p | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize

      - name: Build 05 - ProtoInputUtilStatic64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solutionDir = (Resolve-Path "src\ProtoInput").Path + "\"

          & msbuild "src\ProtoInput\ProtoInputUtil\ProtoInputUtil.vcxproj" `
            /m:1 `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$solutionDir" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) { throw "ProtoInputUtilStatic build failed: $LASTEXITCODE" }

      - name: Verify 05 - ProtoInputUtilStatic64.lib
        shell: powershell
        run: |
          $p = "src\ProtoInput\Release\ProtoInputUtilStatic64.lib"
          if (-not (Test-Path $p)) { throw "Missing: $p" }
          Get-Item $p | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize

      - name: Build 06 - ProtoInputUtilDynamic64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solutionDir = (Resolve-Path "src\ProtoInput").Path + "\"

          & msbuild "src\ProtoInput\ProtoInputUtilDynamic\ProtoInputUtilDynamic.vcxproj" `
            /m:1 `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$solutionDir" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) { throw "ProtoInputUtilDynamic build failed: $LASTEXITCODE" }

      - name: Build 07 - ProtoInputIJP64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solutionDir = (Resolve-Path "src\ProtoInput").Path + "\"

          & msbuild "src\ProtoInput\ProtoInputInjectorProxy\ProtoInputInjectorProxy.vcxproj" `
            /m:1 `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$solutionDir" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) { throw "ProtoInputInjectorProxy build failed: $LASTEXITCODE" }

      - name: Build 08 - ProtoInputIJ64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solutionDir = (Resolve-Path "src\ProtoInput").Path + "\"

          & msbuild "src\ProtoInput\ProtoInputInjector\ProtoInputInjector.vcxproj" `
            /m:1 `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$solutionDir" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) { throw "ProtoInputInjector build failed: $LASTEXITCODE" }

      # Hooks require exactly the libraries built above:
      # BlackBone + UtilStatic + OpenXinput + EasyHook.
      - name: Build 09 - ProtoInputHooks64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solutionDir = (Resolve-Path "src\ProtoInput").Path + "\"

          & msbuild "src\ProtoInput\ProtoInputHooks\ProtoInputHooks.vcxproj" `
            /m:1 `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$solutionDir" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) { throw "ProtoInputHooks build failed: $LASTEXITCODE" }

      # Loader's solution-level dependencies include Hooks and Injector.
      # Both already exist now, so build Loader after them.
      - name: Build 10 - ProtoInputLoader64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solutionDir = (Resolve-Path "src\ProtoInput").Path + "\"

          & msbuild "src\ProtoInput\ProtoInputLoader\ProtoInputLoader.vcxproj" `
            /m:1 `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$solutionDir" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) { throw "ProtoInputLoader build failed: $LASTEXITCODE" }

      - name: Build 11 - ProtoInputHost x64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solutionDir = (Resolve-Path "src\ProtoInput").Path + "\"

          & msbuild "src\ProtoInput\ProtoInputHost\ProtoInputHost.vcxproj" `
            /m:1 `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$solutionDir" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) { throw "ProtoInputHost build failed: $LASTEXITCODE" }

      # Use exact paths: do not recursively pick a same-named stale binary.
      - name: Verify all final x64 outputs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "src\ProtoInput\Release\ProtoInputUtilDynamic64.dll",
            "src\ProtoInput\Release\ProtoInputIJP64.dll",
            "src\ProtoInput\Release\ProtoInputIJ64.exe",
            "src\ProtoInput\Release\ProtoInputHooks64.dll",
            "src\ProtoInput\Release\ProtoInputLoader64.dll",
            "src\ProtoInput\Release\x64\ProtoInputHost.exe"
          )

          foreach ($p in $required) {
            if (-not (Test-Path $p)) {
              throw "Required final binary missing: $p"
            }
            Get-Item $p |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize
          }

      - name: Verify Loader exports and PE dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $loader = "src\ProtoInput\Release\ProtoInputLoader64.dll"
          $exports = & dumpbin /exports $loader | Out-String

          $requiredExports = @(
            "EasyHookInjectRuntime",
            "SetupState",
            "InstallHook",
            "SetControllerIndex",
            "SetTranslateXinputtoMKB",
            "SetXinputtoMKBkeys",
            "SetXinputtoMKBCFG"
          )

          foreach ($symbol in $requiredExports) {
            if ($exports -notmatch [regex]::Escape($symbol)) {
              Write-Host $exports
              throw "Required Loader export missing: $symbol"
            }
            Write-Host "OK export: $symbol"
          }

          Write-Host "`n=== PE dependencies ==="
          foreach ($p in @(
            "src\ProtoInput\Release\ProtoInputLoader64.dll",
            "src\ProtoInput\Release\ProtoInputHooks64.dll",
            "src\ProtoInput\Release\ProtoInputIJ64.exe",
            "src\ProtoInput\Release\ProtoInputIJP64.dll"
          )) {
            Write-Host "`n--- $p ---"
            & dumpbin /dependents $p
          }

      - name: Package exact runtime files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $out = "artifact\protoinput-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $map = @{
            "src\ProtoInput\Release\ProtoInputLoader64.dll"       = "ProtoInputLoader64.dll"
            "src\ProtoInput\Release\ProtoInputHooks64.dll"        = "ProtoInputHooks64.dll"
            "src\ProtoInput\Release\ProtoInputIJ64.exe"           = "ProtoInputIJ64.exe"
            "src\ProtoInput\Release\ProtoInputIJP64.dll"          = "ProtoInputIJP64.dll"
            "src\ProtoInput\Release\ProtoInputUtilDynamic64.dll"  = "ProtoInputUtilDynamic64.dll"
            "src\ProtoInput\Release\x64\ProtoInputHost.exe"       = "ProtoInputHost.exe"
          }

          foreach ($src in $map.Keys) {
            Copy-Item $src (Join-Path $out $map[$src]) -Force
          }

          Write-Host "=== Artifact contents ==="
          Get-ChildItem $out |
            Select-Object Name,Length,LastWriteTime |
            Format-Table -AutoSize

          Write-Host "`n=== SHA256 ==="
          Get-ChildItem $out -File |
            Get-FileHash -Algorithm SHA256 |
            Select-Object Path,Hash |
            Format-Table -AutoSize

      - name: Upload ProtoInput x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: protoinput-x64
          path: artifact/protoinput-x64/
          if-no-files-found: error
          retention-days: 7
