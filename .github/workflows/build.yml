name: Build ProtoInput x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install missing v142 ATL
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) {
            throw "Could not locate Visual Studio."
          }

          Write-Host "Visual Studio: $vsPath"

          $v142 = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory |
            Where-Object { $_.Name -like "14.29*" } |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $v142) {
            throw "v142 (14.29) toolset is not installed on this runner."
          }

          $atlHeader = Join-Path $v142.FullName "atlmfc\include\atlbase.h"

          if (Test-Path $atlHeader) {
            Write-Host "v142 ATL already installed:"
            Write-Host "  $atlHeader"
          }
          else {
            Write-Host "v142 ATL is missing. Installing it..."

            Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer"

            [string]$ComponentsToAdd = @(
              "Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL"
            ) | ForEach-Object { "--add $_" }

            $ArgumentList = @(
              "modify",
              "--installPath", "`"$vsPath`"",
              $ComponentsToAdd,
              "--quiet",
              "--norestart",
              "--nocache"
            )

            Write-Host "vs_installer.exe $($ArgumentList -join ' ')"

            $p = Start-Process `
              -FilePath ".\vs_installer.exe" `
              -ArgumentList $ArgumentList `
              -Wait `
              -PassThru

            Write-Host "VS Installer exit code: $($p.ExitCode)"

            if (-not (Test-Path $atlHeader)) {
              throw "v142 ATL installation finished, but atlbase.h is still missing: $atlHeader"
            }
          }

          Write-Host "ATL check passed:"
          Write-Host "  $atlHeader"

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Show toolchain
        shell: powershell
        run: |
          Write-Host "=== MSBuild ==="
          msbuild -version

          Write-Host "`n=== v142 ATL ==="
          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue |
            Select-Object -First 10 FullName

          Write-Host "`n=== Windows SDKs ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" |
            Select-Object -ExpandProperty Name

      # ProtoInput.sln includes only EasyHookDll, but EasyHookDll itself has
      # managed ProjectReferences. On this repository/MSBuild combination they
      # can inherit Debug|x64 incorrectly. We only need the native EasyHook64.lib,
      # so build EasyHookDll directly and suppress those ProjectReferences.
      - name: Build EasyHook native x64 first
        shell: cmd
        run: >
          msbuild lib\EasyHook\EasyHookDll\EasyHookDll.vcxproj
          /m
          /t:Build
          /p:Configuration=netfx4-Release
          /p:Platform=x64
          /p:WindowsTargetPlatformVersion=10.0.19041.0
          /p:PlatformToolset=v142
          /p:BuildProjectReferences=false
          /verbosity:minimal

      - name: Verify EasyHook64.lib
        shell: powershell
        run: |
          $matches = Get-ChildItem "lib\EasyHook" -Recurse -File -Filter "EasyHook64.lib"
          if (-not $matches) {
            throw "EasyHook64.lib was not produced."
          }

          Write-Host "Found EasyHook64.lib:"
          $matches | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize

      # Nucleus' own contribution guide calls out BlackBone/ATL and build-order
      # sensitivity. Pre-build BlackBone so ProtoInputUtilStatic cannot race it.
      - name: Build BlackBone x64 first
        shell: cmd
        run: >
          msbuild lib\Blackbone\src\BlackBone\BlackBone.vcxproj
          /m
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64
          /p:WindowsTargetPlatformVersion=10.0.19041.0
          /p:PlatformToolset=v142
          /verbosity:minimal

      - name: Verify BlackBone.lib
        shell: powershell
        run: |
          $matches = Get-ChildItem . -Recurse -File -Filter "BlackBone.lib"
          if (-not $matches) {
            throw "BlackBone.lib was not produced."
          }

          Write-Host "Found BlackBone.lib:"
          $matches | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize

      # Now build the full ProtoInput solution. Project references are disabled
      # because the two troublesome external dependencies were built explicitly.
      # /m:1 avoids dependency-order races in this old solution.
      - name: Build ProtoInput Release x64
        shell: cmd
        run: >
          msbuild src\ProtoInput\ProtoInput.sln
          /m:1
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64
          /p:WindowsTargetPlatformVersion=10.0.19041.0
          /p:PlatformToolset=v142
          /p:BuildProjectReferences=false
          /verbosity:minimal

      - name: Inspect ProtoInput outputs
        shell: powershell
        run: |
          Write-Host "=== ProtoInput output candidates ==="

          Get-ChildItem . -Recurse -File |
            Where-Object {
              $_.Name -match '^ProtoInput.*\.(dll|exe)$' -or
              $_.Name -eq 'EasyHook64.dll' -or
              $_.Name -eq 'OpenXinput64.dll'
            } |
            Sort-Object FullName |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Collect x64 runtime files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $out = Join-Path $PWD "artifact\protoinput-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $wanted = @(
            "ProtoInputLoader64.dll",
            "ProtoInputHooks64.dll",
            "ProtoInputHost.exe",
            "ProtoInputIJ64.exe",
            "ProtoInputIJP64.dll",
            "ProtoInputUtilDynamic64.dll"
          )

          foreach ($name in $wanted) {
            $matches = Get-ChildItem . -Recurse -File -Filter $name |
              Where-Object { $_.FullName -notmatch '\\artifact\\' }

            if (-not $matches) {
              Write-Warning "Not found: $name"
              continue
            }

            # Prefer the standard ProtoInput Release output folder.
            $pick = $matches |
              Sort-Object @{
                Expression = {
                  if ($_.FullName -match '\\src\\ProtoInput\\Release\\') { 0 }
                  else { 1 }
                }
              }, FullName |
              Select-Object -First 1

            Copy-Item $pick.FullName (Join-Path $out $name) -Force
            Write-Host "Collected: $name"
            Write-Host "  from $($pick.FullName)"
          }

          # Runtime dependencies, if produced.
          foreach ($dep in @("EasyHook64.dll", "OpenXinput64.dll")) {
            $pick = Get-ChildItem . -Recurse -File -Filter $dep |
              Where-Object { $_.FullName -notmatch '\\artifact\\' } |
              Select-Object -First 1

            if ($pick) {
              Copy-Item $pick.FullName (Join-Path $out $dep) -Force
              Write-Host "Collected dependency: $dep"
            }
          }

          Write-Host "`n=== Final artifact ==="
          Get-ChildItem $out |
            Select-Object Name, Length, LastWriteTime |
            Format-Table -AutoSize

          $loader = Join-Path $out "ProtoInputLoader64.dll"
          if (-not (Test-Path $loader)) {
            throw "ProtoInputLoader64.dll was not produced."
          }

          Write-Host "`n=== Required export check ==="
          $exports = & dumpbin /exports $loader | Out-String

          $required = @(
            "SetTranslateXinputtoMKB",
            "SetXinputtoMKBkeys",
            "SetXinputtoMKBCFG"
          )

          foreach ($symbol in $required) {
            if ($exports -notmatch [regex]::Escape($symbol)) {
              Write-Host $exports
              throw "Required export missing: $symbol"
            }
            Write-Host "OK: $symbol"
          }

      - name: Upload ProtoInput x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: protoinput-x64
          path: artifact/protoinput-x64/
          if-no-files-found: error
          retention-days: 7
